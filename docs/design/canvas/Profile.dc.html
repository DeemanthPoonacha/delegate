<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;--bg:#FFFFFF;--surface:#F6F6F7;--line:#ECECEE;--text:#0B0B0C;--body:#6E7076;--faint:#9A9CA3;--money:#0E7C5A;--money-hi:#0A5E44;--accent:#0B0B0C;--on-accent:#FFFFFF;--on-money:#FFFFFF;}
a{color:var(--money);text-decoration:none}a:hover{color:var(--money-hi)}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; padding: 52px 0 0; {{ vars }}">

  <div style="padding: 0 14px;">
    <a href="Otp.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 24px 0; display: flex; flex-direction: column; gap: 24px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.12; letter-spacing: -1px; color: var(--text);">Who are you?</h1>

    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: var(--body);">R</span>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 500; color: var(--text);">Add a photo</button>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line);">
        <label for="name" style="font-size: 13px; font-weight: 500; color: var(--body);">Full name, as on your ID</label>
        <input id="name" type="text" value="Rohit Yadav" style="border: none; outline: none; background: transparent; padding: 0; font-size: 17px; font-weight: 500; color: var(--text);">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line);">
        <label for="city" style="font-size: 13px; font-weight: 500; color: var(--body);">City</label>
        <input id="city" type="text" value="Bangalore" style="border: none; outline: none; background: transparent; padding: 0; font-size: 17px; font-weight: 500; color: var(--text);">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line);">
        <span style="font-size: 13px; font-weight: 500; color: var(--body);">Languages you're comfortable in</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="5">
            <span style="{{ l.style }}">{{ l.name }}</span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 13px; font-weight: 500; color: var(--body);">What brings you here first?</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" style="flex-grow: 1; padding: 16px 14px; border-radius: 12px; border: 1.5px solid var(--text); background: var(--bg); text-align: left; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 600; color: var(--text);">I need things done</span>
          <span style="font-size: 12.5px; color: var(--body);">Start posting now</span>
        </button>
        <button type="button" style="flex-grow: 1; padding: 16px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); text-align: left; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 600; color: var(--text);">I want to earn</span>
          <span style="font-size: 12.5px; color: var(--body);">Needs ID and a bank account</span>
        </button>
      </div>
    </div>
  </div>

  <div style="padding: 16px 24px 24px;">
    <a href="HomeRequester.dc.html" style="height: 54px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
var DARK = '--bg:#0B0B0C;--surface:#17181B;--line:#26282D;--text:#F6F6F7;--body:#9A9CA3;--faint:#6E7076;--money:#3FBF8F;--money-hi:#5FD3A6;--accent:#F6F6F7;--on-accent:#0B0B0C;--on-money:#05130C;';
class Component extends DCLogic {
  renderVals() {
    var on = 'display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:500;';
    var off = 'display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--body);font-size:14px;';
    return {
      vars: this.props.theme === 'dark' ? DARK : '',
      langs: [
        { name: 'English', style: on }, { name: 'Hindi', style: on },
        { name: 'Kannada', style: off }, { name: 'Tamil', style: off }, { name: 'Telugu', style: off }
      ]
    };
  }
}
</script>
</body>
</html>
