<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#0E7C5A;text-decoration:none}a:hover{color:#0A5E44}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#9A9CA3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 52px 0 0;">

  <div style="padding: 0 14px;">
    <a href="Otp.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B0C;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 24px 0; display: flex; flex-direction: column; gap: 24px;">
    <h1 style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -1.1px; color: #0B0B0C;">Who are you?</h1>

    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #F6F6F7; border: 1px solid #ECECEE; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: #6E7076;">R</span>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #ECECEE; background: #FFFFFF; font-size: 14px; font-weight: 500; color: #0B0B0C;">Add a photo</button>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid #ECECEE;">
        <label for="name" style="font-size: 13px; font-weight: 500; color: #6E7076;">Full name, as on your ID</label>
        <input id="name" type="text" value="Rohit Yadav" style="border: none; outline: none; background: transparent; padding: 0; font-size: 17px; font-weight: 500; color: #0B0B0C;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid #ECECEE;">
        <label for="city" style="font-size: 13px; font-weight: 500; color: #6E7076;">City</label>
        <input id="city" type="text" value="Bangalore" style="border: none; outline: none; background: transparent; padding: 0; font-size: 17px; font-weight: 500; color: #0B0B0C;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 0; border-bottom: 1px solid #ECECEE;">
        <span style="font-size: 13px; font-weight: 500; color: #6E7076;">Languages you're comfortable in</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="5">
            <span style="{{ l.style }}">{{ l.name }}</span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 13px; font-weight: 500; color: #6E7076;">What brings you here first?</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" style="flex-grow: 1; padding: 16px 14px; border-radius: 12px; border: 1.5px solid #0B0B0C; background: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 600; color: #0B0B0C;">I need things done</span>
          <span style="font-size: 12.5px; color: #6E7076;">Start posting now</span>
        </button>
        <button type="button" style="flex-grow: 1; padding: 16px 14px; border-radius: 12px; border: 1px solid #ECECEE; background: #FFFFFF; text-align: left; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 600; color: #0B0B0C;">I want to earn</span>
          <span style="font-size: 12.5px; color: #6E7076;">Needs ID and a bank account</span>
        </button>
      </div>
    </div>
  </div>

  <div style="padding: 16px 24px 24px;">
    <a href="HomeRequester.dc.html" style="height: 54px; border-radius: 12px; background: #0B0B0C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = 'display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:#0B0B0C;color:#FFFFFF;font-size:14px;font-weight:500;';
    var off = 'display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #ECECEE;color:#6E7076;font-size:14px;';
    return {
      langs: [
        { name: 'English', style: on }, { name: 'Hindi', style: on },
        { name: 'Kannada', style: off }, { name: 'Tamil', style: off }, { name: 'Telugu', style: off }
      ]
    };
  }
}
</script>
</body>
</html>
