<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a doer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#0E7C5A;text-decoration:none}a:hover{color:#0A5E44}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 52px 0 0;">

  <div style="padding: 0 14px; display: flex; align-items: center; gap: 4px;">
    <a href="HomeRequester.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B0C;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
  </div>

  <div style="padding: 6px 24px 18px; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 27px; font-weight: 600; line-height: 1.12; letter-spacing: -1px; color: #0B0B0C;">Four want this</h1>
    <span style="font-size: 14px; color: #6E7076;">Motor claim · ₹250 · due today</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 24px; display: flex; flex-direction: column;">
    <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
      <div style="{{ p.rowStyle }}">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 999px; background: #F6F6F7; border: 1px solid #ECECEE; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #0B0B0C;">{{ p.initials }}</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 16px; font-weight: 600; color: #0B0B0C;">{{ p.name }}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E7C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <span style="font-size: 13px; color: #6E7076; font-variant-numeric: tabular-nums;">{{ p.stats }}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; color: #0B0B0C; font-variant-numeric: tabular-nums;">{{ p.price }}</span>
            <span style="font-size: 12.5px; color: #6E7076;">{{ p.eta }}</span>
          </div>
        </div>

        <span style="{{ p.specialStyle }}">{{ p.special }}</span>

        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #6E7076;">{{ p.pitch }}</p>

        <div style="display: flex; gap: 10px;">
          <a href="TaskRoom.dc.html" style="flex-grow: 1; height: 44px; border-radius: 12px; border: 1px solid #ECECEE; color: #0B0B0C; display: flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 500;">Ask first</a>
          <a href="Fund.dc.html" style="{{ p.pickStyle }}">Pick {{ p.first }}</a>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 14px 24px 24px; border-top: 1px solid #ECECEE; display: flex; align-items: center; gap: 8px;">
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #0E7C5A; display: block;"></span>
    <span style="font-size: 13px; color: #6E7076;">Picking holds your ₹250. It does not pay them.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var row = 'display:flex;flex-direction:column;gap:12px;padding:20px 0;border-bottom:1px solid #ECECEE;';
    var special = function (strong) {
      return strong
        ? 'align-self:flex-start;display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:#0B0B0C;color:#FFFFFF;font-size:12.5px;font-weight:500;'
        : 'align-self:flex-start;display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:#F6F6F7;border:1px solid #ECECEE;color:#6E7076;font-size:12.5px;';
    };
    var pick = function (primary) {
      return 'flex-grow:1.2;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;' +
        (primary ? 'background:#0B0B0C;color:#FFFFFF;' : 'background:#FFFFFF;border:1px solid #ECECEE;color:#0B0B0C;');
    };
    return {
      people: [
        { name: 'Faisal R.', first: 'Faisal', initials: 'FR', stats: '4.9 · 61 tasks · 38 claims logged', price: '₹250', eta: 'starts now',
          special: 'Insurance specialist', specialStyle: special(true), rowStyle: row, pickStyle: pick(true),
          pitch: 'Six years as an ICICI Lombard agent. I know which desk logs motor claims fastest.' },
        { name: 'Meera S.', first: 'Meera', initials: 'MS', stats: '4.8 · 124 tasks · 9 claims logged', price: '₹250', eta: 'in 20 min',
          special: 'Verified · bank matched', specialStyle: special(false), rowStyle: row, pickStyle: pick(false),
          pitch: 'Ex-banker, phone paperwork daily. Happy to send a recording of the call.' },
        { name: 'Kiran D.', first: 'Kiran', initials: 'KD', stats: '4.6 · 18 tasks · first claim task', price: '₹200', eta: 'in 1 hour',
          special: 'Verified', specialStyle: special(false), rowStyle: row, pickStyle: pick(false),
          pitch: 'Free all afternoon and happy to stay on hold as long as it takes.' }
      ]
    };
  }
}
</script>
</body>
</html>
