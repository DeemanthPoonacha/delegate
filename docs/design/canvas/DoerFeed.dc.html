<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find work</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0B0B0C;-webkit-font-smoothing:antialiased}
a{color:#3FBF8F;text-decoration:none}a:hover{color:#5FD3A6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0C; display: flex; flex-direction: column; padding: 52px 0 0;">

  <div style="padding: 0 14px; display: flex; align-items: center; justify-content: space-between;">
    <a href="HomeDoer.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F6F6F7;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
    <button type="button" style="margin-right: 14px; height: 36px; padding: 0 14px; border-radius: 999px; background: #17181B; border: 1px solid #26282D; color: #F6F6F7; font-size: 13.5px; font-weight: 500;">Filters</button>
  </div>

  <div style="padding: 6px 24px 16px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 27px; font-weight: 600; line-height: 1.12; letter-spacing: -1px; color: #F6F6F7;">Matched to you</h1>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
        <span style="{{ c.style }}">{{ c.label }}</span>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 24px; display: flex; flex-direction: column;">
    <sc-for list="{{ feed }}" as="t" hint-placeholder-count="4">
      <a href="TaskRoom.dc.html" style="padding: 18px 0; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #26282D;">
        <div style="display: flex; align-items: flex-start; gap: 16px;">
          <span style="flex-grow: 1; font-size: 16px; font-weight: 500; line-height: 1.35; color: #F6F6F7;">{{ t.title }}</span>
          <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <span style="font-size: 18px; font-weight: 600; color: #F6F6F7; font-variant-numeric: tabular-nums;">{{ t.net }}</span>
            <span style="font-size: 12px; color: #9A9CA3;">you keep of {{ t.gross }}</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <span style="{{ t.tagStyle }}">{{ t.tag }}</span>
          <span style="font-size: 13px; color: #9A9CA3;">{{ t.time }}</span>
          <span style="font-size: 13px; color: #9A9CA3;">{{ t.where }}</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 12.5px; color: #3FBF8F;">{{ t.posted }}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="padding: 14px 24px 24px; border-top: 1px solid #26282D; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12.5px; color: #9A9CA3;">Your floor</span>
      <span style="font-size: 15px; font-weight: 500; color: #F6F6F7; font-variant-numeric: tabular-nums;">₹200 / hour</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #17181B; border: 1px solid #26282D; color: #F6F6F7; font-size: 14px; font-weight: 500;">Adjust</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = 'display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:#F6F6F7;color:#0B0B0C;font-size:13px;font-weight:500;';
    var off = 'display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:#17181B;border:1px solid #26282D;color:#9A9CA3;font-size:13px;';
    var tagStrong = 'display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:#17181B;border:1px solid #3A3D44;color:#F6F6F7;font-size:12px;font-weight:500;';
    var tagPlain = 'display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:#17181B;color:#9A9CA3;font-size:12px;';
    return {
      chips: [
        { label: 'Insurance', style: on }, { label: 'Paperwork', style: on }, { label: '≥ ₹200/hr', style: off }
      ],
      feed: [
        { title: 'Log a Star Health claim and send the claim number', net: '₹246', gross: '₹300', tag: 'Your speciality', tagStyle: tagStrong, time: '~40 min', where: 'Remote', posted: 'just now' },
        { title: 'Fill a 12-page school admission form', net: '₹163', gross: '₹199', tag: 'Paperwork', tagStyle: tagPlain, time: '~45 min', where: 'Remote', posted: '4 min ago' },
        { title: 'Collect an attested document, sub-registrar Jayanagar', net: '₹327', gross: '₹399', tag: 'In person', tagStyle: tagPlain, time: '~3 hrs', where: 'Jayanagar', posted: '12 min ago' },
        { title: 'Chase a rejected mediclaim to a written reason', net: '₹409', gross: '₹499', tag: 'Insurance', tagStyle: tagPlain, time: '~2 hrs', where: 'Remote', posted: '25 min ago' }
      ]
    };
  }
}
</script>
</body>
</html>
