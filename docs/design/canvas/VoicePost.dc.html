<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post by voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;--bg:#FFFFFF;--surface:#F6F6F7;--line:#ECECEE;--text:#0B0B0C;--body:#6E7076;--faint:#9A9CA3;--money:#0E7C5A;--money-hi:#0A5E44;--accent:#0B0B0C;--on-accent:#FFFFFF;--on-money:#FFFFFF;}
a{color:var(--money);text-decoration:none}a:hover{color:var(--money-hi)}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; padding: 52px 24px 24px; {{ vars }}">

  <span style="display: inline-flex; align-self: flex-start; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--body);">Phase 4+</span>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-bottom: 20px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.12; letter-spacing: -1px; color: var(--text);">Just say it.</h1>

    <div style="display: flex; align-items: center; gap: 4px; height: 56px;">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="28">
        <span style="{{ b.style }}"></span>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: var(--surface); border-radius: 14px;">
      <span style="font-size: 12.5px; font-weight: 500; color: var(--body);">We heard</span>
      <p style="margin: 0; font-size: 17px; font-weight: 500; line-height: 1.4; letter-spacing: -0.2px; color: var(--text);">"Someone needs to call Star Health and log my claim, I've got the policy number, need it done today"</p>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{ parsed }}" as="p" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line);">
          <span style="font-size: 14px; color: var(--body);">{{ p.label }}</span>
          <span style="font-size: 15px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums;">{{ p.value }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <a href="Post.dc.html" style="height: 54px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">Looks right — post it</a>
    <p style="margin: 0; text-align: center; font-size: 13px; color: var(--body);">Nine seconds instead of ninety.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":844}}'>
var DARK = '--bg:#0B0B0C;--surface:#17181B;--line:#26282D;--text:#F6F6F7;--body:#9A9CA3;--faint:#6E7076;--money:#3FBF8F;--money-hi:#5FD3A6;--accent:#F6F6F7;--on-accent:#0B0B0C;--on-money:#05130C;';
class Component extends DCLogic {
  renderVals() {
    var heights = [14, 26, 38, 22, 48, 30, 18, 42, 52, 34, 20, 44, 28, 16, 36, 50, 24, 40, 30, 18, 46, 26, 14, 32, 22, 12, 10, 8];
    return {
      vars: this.props.theme === 'dark' ? DARK : '',
      bars: heights.map(function (h, i) {
        return { style: 'flex-grow:1;height:' + h + 'px;border-radius:999px;background:' + (i < 22 ? 'var(--text)' : 'var(--line)') + ';display:block;' };
      }),
      parsed: [
        { label: 'Category', value: 'Insurance & claims' },
        { label: 'You get back', value: 'A claim number' },
        { label: 'By', value: 'Today, 6:00 pm' },
        { label: 'Suggested price', value: '₹250' }
      ]
    };
  }
}
</script>
</body>
</html>
